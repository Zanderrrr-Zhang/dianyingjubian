<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #ecebe5; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="m" width="560" height="760" viewBox="0 0 560 760"></svg>
<script>
(async () => {
  const W = 560, H = 760;
  const svg = d3.select('#m');
  const EP = [
    [1, '西西里', 14.25, 37.35, -1],
    [2, '那不勒斯', 14.27, 40.85, -1],
    [3, '罗马', 12.50, 41.90, -1],
    [4, '佛罗伦萨', 11.25, 43.77, -1],
    [5, '罗马涅山区修道院', 11.85, 44.05, 1],
    [6, '波河三角洲', 12.30, 44.85, 1],
  ];
  const PLACES = [
    ['米兰 · 洛雷托广场', 9.22, 45.49, 1, -16],
    ['萨罗', 10.52, 45.61, 1, 0],
    ['电影城', 12.75, 41.55, 1, 0],
  ];
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
    const all = topojson.feature(topo, topo.objects.countries);
    const italy = all.features.find(f => +f.id === 380);
    const proj = d3.geoMercator().fitExtent([[24, 16], [W - 24, H - 16]], italy);
    const path = d3.geoPath(proj);

    svg.append('defs').html('<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9622f"/></marker>');
    svg.append('g').selectAll('path').data(all.features.filter(f => +f.id !== 380)).join('path')
      .attr('d', path).attr('fill', '#dedcd4').attr('stroke', '#c9c6bb').attr('stroke-width', 0.8);
    svg.append('path').datum(italy).attr('d', path).attr('fill', '#f6f5f0').attr('stroke', '#15140f').attr('stroke-width', 1.4);

    const pts = EP.map(e => proj([e[2], e[3]]));
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const dx = last[0] - prev[0], dy = last[1] - prev[1], len = Math.hypot(dx, dy);
    const routePts = pts.slice(0, -1).concat([[last[0] - dx / len * 17, last[1] - dy / len * 17]]);
    svg.append('path').attr('d', d3.line().curve(d3.curveCatmullRom.alpha(0.5))(routePts))
      .attr('fill', 'none').attr('stroke', '#d9622f').attr('stroke-width', 3).attr('marker-end', 'url(#arr)');

    const pl = svg.append('g');
    PLACES.forEach(p => {
      const [x, y] = proj([p[1], p[2]]);
      pl.append('rect').attr('x', x - 4).attr('y', y - 4).attr('width', 8).attr('height', 8).attr('fill', '#15140f');
      pl.append('text').attr('x', x + p[3] * 10).attr('y', y + 5 + p[4]).attr('text-anchor', p[3] < 0 ? 'end' : 'start')
        .attr('font-family', 'Noto Sans SC').attr('font-size', 16).attr('fill', '#15140f').text(p[0]);
    });

    const g = svg.append('g');
    EP.forEach((e, i) => {
      const [x, y] = pts[i];
      g.append('circle').attr('cx', x).attr('cy', y).attr('r', 13).attr('fill', '#d9622f').attr('stroke', '#ecebe5').attr('stroke-width', 2);
      g.append('text').attr('x', x).attr('y', y + 5).attr('text-anchor', 'middle')
        .attr('font-family', 'IBM Plex Mono').attr('font-weight', 600).attr('font-size', 15).attr('fill', '#fff').text(e[0]);
      g.append('text').attr('x', x + e[4] * 20).attr('y', y + 6).attr('text-anchor', e[4] < 0 ? 'end' : 'start')
        .attr('font-family', 'Noto Sans SC').attr('font-weight', 700).attr('font-size', 18).attr('fill', '#15140f').text(e[1]);
    });

    svg.append('text').attr('x', W - 24).attr('y', H - 18).attr('text-anchor', 'end')
      .attr('font-family', 'Noto Sans SC').attr('font-size', 12).attr('fill', '#7a776d').text('底图：Natural Earth');
  } catch (err) {
    svg.append('text').attr('x', 20).attr('y', 40).attr('font-family', 'Noto Sans SC').attr('font-size', 16).attr('fill', '#7a776d').text('地图数据加载失败');
    console.warn(err);
  }
})();
</script>
</body>
</html>
