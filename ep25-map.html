<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #F2EBDD; }
  svg { display: block; box-sizing: border-box; border: 2px solid #111; }
</style>
</head>
<body>
<svg id="wa" width="300" height="214" viewBox="0 0 300 214"></svg>
<script>
(async () => {
  const svg = d3.select('#wa');
  const W = 300, H = 214;
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json')).json();
    const states = topojson.feature(topo, topo.objects.states).features;
    const wa = states.find(f => f.id === '53');
    const proj = d3.geoMercator().fitExtent([[18, 30], [W - 18, H - 22]], wa);
    const path = d3.geoPath(proj);
    svg.append('g').selectAll('path').data(states.filter(f => f.id === '16' || f.id === '41')).join('path')
      .attr('d', path).attr('fill', '#E3DACA').attr('stroke', '#B9B0A0').attr('stroke-width', 0.8);
    svg.append('path').datum(wa).attr('d', path).attr('fill', '#F7F2E7').attr('stroke', '#111').attr('stroke-width', 1.2);
    const txt = (x, y, s, o = {}) => svg.append('text').attr('x', x).attr('y', y).attr('text-anchor', o.anchor || 'middle')
      .attr('font-family', o.serif ? 'Noto Serif SC' : 'Noto Sans SC').attr('font-weight', o.serif ? 900 : 500)
      .attr('font-size', o.size || 12).attr('fill', o.fill || '#5C564B').attr('letter-spacing', o.ls || '0.1em').text(s);
    txt(W / 2, 18, '加拿大');
    txt(W - 8, 120, '爱达荷', { anchor: 'end' });
    txt(W / 2, H - 6, '俄勒冈');
    const sea = proj([-122.3321, 47.6062]);
    svg.append('circle').attr('cx', sea[0]).attr('cy', sea[1]).attr('r', 3).attr('fill', '#111');
    txt(sea[0] - 5, sea[1] + 16, '西雅图', { anchor: 'end', fill: '#111' });
    const v = proj([-121.83, 47.53]);
    svg.append('rect').attr('x', v[0] - 6).attr('y', v[1] - 6).attr('width', 12).attr('height', 12).attr('fill', 'none').attr('stroke', '#8E1B1B').attr('stroke-width', 2.5);
    txt(v[0] + 10, v[1] - 8, '取景地 1–6', { anchor: 'start', fill: '#8E1B1B' });
    const k = proj([-122.5831, 47.69935]), kl = [k[0] - 6, k[1] - 24];
    svg.append('line').attr('x1', k[0]).attr('y1', k[1]).attr('x2', kl[0]).attr('y2', kl[1] + 6).attr('stroke', '#8E1B1B').attr('stroke-width', 1.2);
    svg.append('circle').attr('cx', k[0]).attr('cy', k[1]).attr('r', 2.5).attr('fill', '#8E1B1B');
    svg.append('circle').attr('cx', kl[0]).attr('cy', kl[1]).attr('r', 7).attr('fill', '#8E1B1B');
    svg.append('text').attr('x', kl[0]).attr('y', kl[1] + 3.5).attr('text-anchor', 'middle').attr('font-family', 'Space Mono').attr('font-weight', 700).attr('font-size', 9).attr('fill', '#F2EBDD').text('7');
    const tp = proj([-117.30, 48.93]);
    svg.append('circle').attr('cx', tp[0]).attr('cy', tp[1]).attr('r', 9).attr('fill', '#D9A441').attr('fill-opacity', 0.3);
    svg.append('circle').attr('cx', tp[0]).attr('cy', tp[1]).attr('r', 5).attr('fill', '#D9A441').attr('stroke', '#111').attr('stroke-width', 1);
    txt(tp[0] - 10, tp[1] + 20, '剧中的双峰镇', { anchor: 'end', fill: '#111', serif: true, size: 13, ls: '0' });
  } catch (e) {
    console.warn('inset map failed', e);
  }
})();
</script>
</body>
</html>
